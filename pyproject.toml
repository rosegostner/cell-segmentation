[project]
name = "cell-segmentation"
version = "0.1.0"
description = "Automated cell segmentation in microscopy images using Cellpose"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cellpose>=4.2.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.6",
    "Pillow>=11.0.0",
    "scikit-image>=0.26.0",
    "streamlit>=1.66.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
cell-segmentation = "cell_segmentation:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
